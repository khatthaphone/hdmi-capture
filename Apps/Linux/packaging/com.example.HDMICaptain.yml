# Flatpak manifest (task 122). Build with `make linux-flatpak` (tools/linux/flatpak.sh), which also refreshes
# nuget-sources.json (tools/linux/flatpak-nuget-sources.py) so the build runs offline, as Flathub requires.
# The source is the committed git tree (not the working copy), so local build outputs never reach the package.
# The app id becomes the real reverse-DNS id before Flathub (task 125).
app-id: com.example.HDMICaptain
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.dotnet10
command: hdmi-captain
finish-args:
  # Raw V4L2 capture: there is no narrower device permission for /dev/video* (linux.md §2a).
  - --device=all
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --socket=pulseaudio
  # Pro licence activation and validation (services/licence).
  - --share=network
  # logind PrepareForSleep, so capture closes cleanly on suspend.
  - --system-talk-name=org.freedesktop.login1
  - --filesystem=xdg-pictures/HDMI Captain:create
  - --filesystem=xdg-videos/HDMI Captain:create
build-options:
  append-path: /usr/lib/sdk/dotnet10/bin
  append-ld-library-path: /usr/lib/sdk/dotnet10/lib
  env:
    PKG_CONFIG_PATH: /app/lib/pkgconfig:/app/share/pkgconfig:/usr/lib/pkgconfig:/usr/share/pkgconfig
    DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
    DOTNET_NOLOGO: 'true'
    DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'
modules:
  # The runtime (GNOME 51, freedesktop 26.08) already has everything else the app loads: GTK 4.24 / libadwaita 1.10,
  # libturbojpeg, ALSA, PulseAudio, EGL/GLES (GL extension), and an ffmpeg with NVENC, VA-API, AMF and x264 H.264
  # encoders plus AAC (the app probes them in that order).
  - name: hdmi-captain
    buildsystem: simple
    sources:
      - type: git
        path: ../../..
        branch: HEAD
      - nuget-sources.json
    build-commands:
      - dotnet publish Apps/Linux/src/HDMICaptain.Linux.App/HDMICaptain.Linux.App.csproj -c Release -r linux-x64 --self-contained
        --source ./nuget-sources -p:PublishReadyToRun=true -o /app/lib/hdmi-captain
      - install -D -m 0755 Apps/Linux/packaging/hdmi-captain-flatpak.sh /app/bin/hdmi-captain
      - install -D -m 0644 Apps/Linux/packaging/com.example.HDMICaptain.desktop /app/share/applications/com.example.HDMICaptain.desktop
      - install -D -m 0644 Apps/Linux/packaging/com.example.HDMICaptain.metainfo.xml /app/share/metainfo/com.example.HDMICaptain.metainfo.xml
      - cd Apps/Linux/packaging/icons && find . -name '*.png' -exec install -D -m 0644 {} /app/share/icons/{} \;
