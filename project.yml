name: HDMICaptain
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  CaptureCore:
    path: Packages/CaptureCore
  HaishinKit:
    url: https://github.com/HaishinKit/HaishinKit.swift
    exactVersion: 2.2.5
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.6.4
targets:
  HDMICaptain:
    type: application
    platform: macOS
    sources: [Apps/macOS/Sources, Apps/Shared]
    dependencies:
      - package: CaptureCore
      - package: HaishinKit
        product: HaishinKit
      - package: HaishinKit
        product: RTMPHaishinKit
    info:
      path: Apps/macOS/Info.plist
      properties:
        CFBundleDisplayName: HDMI Captain
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.utilities
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSCameraUsageDescription: HDMI capture cards appear as cameras. HDMI Captain shows the picture from the card you connect.
        NSMicrophoneUsageDescription: HDMI capture cards deliver their sound as a microphone. HDMI Captain plays it; nothing is recorded unless you record.
    entitlements:
      path: Apps/macOS/HDMICaptain.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.device.camera: true
        com.apple.security.device.audio-input: true
        com.apple.security.assets.pictures.read-write: true
        com.apple.security.assets.movies.read-write: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.bookmarks.app-scope: true
        com.apple.security.network.client: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.hdmicaptain
        PRODUCT_NAME: HDMI Captain
        PRODUCT_MODULE_NAME: HDMICaptain
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      storeKitConfiguration: Apps/macOS/HDMICaptain.storekit
      testTargets:
        - HDMICaptainTests
        - package: CaptureCore/CaptureCoreTests
  # Direct-download build (notarized DMG, task 013) with Sparkle updates (019). Same app as the
  # App Store target; the App Store build must never link Sparkle.
  HDMICaptain-Direct:
    type: application
    platform: macOS
    sources: [Apps/macOS/Sources, Apps/Shared]
    dependencies:
      - package: CaptureCore
      - package: HaishinKit
        product: HaishinKit
      - package: HaishinKit
        product: RTMPHaishinKit
      - package: Sparkle
    info:
      path: Apps/macOS/Info.plist
      properties:
        CFBundleDisplayName: HDMI Captain
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.utilities
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSCameraUsageDescription: HDMI capture cards appear as cameras. HDMI Captain shows the picture from the card you connect.
        SUFeedURL: $(SPARKLE_FEED_URL)
        SUPublicEDKey: $(SPARKLE_PUBLIC_ED_KEY)
        SUEnableInstallerLauncherService: true
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSMicrophoneUsageDescription: HDMI capture cards deliver their sound as a microphone. HDMI Captain plays it; nothing is recorded unless you record.
    entitlements:
      path: Apps/macOS/HDMICaptain-Direct.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.device.camera: true
        com.apple.security.device.audio-input: true
        com.apple.security.assets.pictures.read-write: true
        com.apple.security.assets.movies.read-write: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.bookmarks.app-scope: true
        com.apple.security.network.client: true
        # Sparkle's installer launcher in a sandboxed app.
        com.apple.security.temporary-exception.mach-lookup.global-name:
          - $(PRODUCT_BUNDLE_IDENTIFIER)-spks
          - $(PRODUCT_BUNDLE_IDENTIFIER)-spki
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.hdmicaptain
        PRODUCT_NAME: HDMI Captain
        PRODUCT_MODULE_NAME: HDMICaptain
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) DIRECT_DISTRIBUTION
        # Public half of the EdDSA update key (private half stays in the release Mac's keychain).
        SPARKLE_PUBLIC_ED_KEY: TbTBNi1J3uQ81kgptV+cnCx+vPOQgduwjCvRNN5yx3k=
        # Override for local update tests: SPARKLE_FEED_URL=http://127.0.0.1:8765/appcast.xml
        SPARKLE_FEED_URL: https://hdmicaptain.app/appcast.xml
    scheme: {}
  HDMICaptainTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Apps/macOS/Tests
      - path: Apps/macOS/HDMICaptain.storekit
        buildPhase: resources
    dependencies:
      - target: HDMICaptain
      - package: CaptureCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.hdmicaptain.tests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/HDMI Captain.app/Contents/MacOS/HDMI Captain
        BUNDLE_LOADER: $(TEST_HOST)
        GENERATE_INFOPLIST_FILE: YES
  HDMICaptain-iPad:
    type: application
    platform: iOS
    sources: [Apps/iPadOS/Sources, Apps/Shared]
    dependencies:
      - package: CaptureCore
    info:
      path: Apps/iPadOS/Info.plist
      properties:
        CFBundleDisplayName: HDMI Captain
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.utilities
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIRequiresFullScreen: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleExternalDisplayNonInteractive:
              - UISceneConfigurationName: External Display
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).ExternalDisplaySceneDelegate
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSCameraUseExternalDeviceType: true
        NSCameraUsageDescription: HDMI capture cards appear as cameras. HDMI Captain shows the picture from the card you connect.
        NSMicrophoneUsageDescription: HDMI capture cards deliver their sound as a microphone. HDMI Captain plays it; nothing is recorded unless you record.
        NSPhotoLibraryAddUsageDescription: HDMI Captain saves screenshots and recordings to your photo library.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.hdmicaptain
        PRODUCT_NAME: HDMI Captain
        PRODUCT_MODULE_NAME: HDMICaptain
        TARGETED_DEVICE_FAMILY: "2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: Apple Development
    scheme:
      storeKitConfiguration: Apps/macOS/HDMICaptain.storekit
